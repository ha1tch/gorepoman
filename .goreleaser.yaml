version: 2

project_name: gorepoman

before:
  hooks:
    - go mod tidy

builds:
  - id: repoman
    main: ./cmd/repoman
    binary: repoman
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
      - dragonfly
    goarch:
      - amd64
      - arm64
    # DragonFly BSD is x86-64 only -- Go itself has no dragonfly/arm64
    # port (confirmed via `go tool dist list`), so the arm64 leg of the
    # otherwise-uniform goos x goarch matrix has to be excluded here or
    # the build fails outright.
    ignore:
      - goos: dragonfly
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

# format: binary publishes the raw executable directly to the release,
# no tar.gz/zip wrapper -- an agent bootstrapping the tool does one curl
# + chmod, not a download-then-extract step. name_template deliberately
# carries no version: the /releases/latest/download/<name> URL then
# never changes shape across releases, so a bootstrap command written
# once keeps working on every future release without being updated.
# The .exe suffix is conditional on Windows specifically -- Windows
# won't execute a binary without it, and no other platform may have it
# (a bare "repoman-linux-amd64.exe" would be wrong).
#
# Note on OpenBSD specifically: its two binaries come out dynamically
# linked against /usr/libexec/ld.so regardless of CGO_ENABLED -- this is
# long-standing, documented Go-on-OpenBSD behaviour (OpenBSD's own
# W^X/pledge exec-protection model requires it), not a build
# misconfiguration, and /usr/libexec/ld.so is part of every real OpenBSD
# base install, not an extra dependency. The other six platforms produce
# genuinely static binaries; OpenBSD's two are still fully self-contained
# in practice, just not "static" in the strict ldd sense.
archives:
  - format: binary
    name_template: >-
      repoman-{{ .Os }}-{{ .Arch }}{{ if eq .Os "windows" }}.exe{{ end }}

checksum:
  name_template: "checksums.txt"

# No git-log-derived changelog section here: this project's own
# CHANGELOG.md is hand-written with real incident writeups (see
# docs/repoman-020-failure-modes.md for why that matters), and a
# GoReleaser-generated commit-log changelog would just be redundant
# noise on the release page next to it.
changelog:
  disable: true

release:
  github:
    owner: ha1tch
    name: gorepoman
  # CHANGELOG.md already carries the real writeup for this release;
  # the GitHub release body just points at it rather than duplicating
  # or truncating it.
  header: |
    See [CHANGELOG.md](https://github.com/ha1tch/gorepoman/blob/main/CHANGELOG.md) for what changed in this release.

  footer: |
    ## Verifying a download

    ```
    curl -LO https://github.com/ha1tch/gorepoman/releases/latest/download/repoman-linux-amd64
    curl -LO https://github.com/ha1tch/gorepoman/releases/latest/download/checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```

    On Windows (PowerShell), swap the asset name and use `Get-FileHash`
    against the matching line in `checksums.txt` instead of `sha256sum`:

    ```
    curl.exe -LO https://github.com/ha1tch/gorepoman/releases/latest/download/repoman-windows-amd64.exe
    curl.exe -LO https://github.com/ha1tch/gorepoman/releases/latest/download/checksums.txt
    Get-FileHash repoman-windows-amd64.exe -Algorithm SHA256
    ```

    On the BSDs, the base install typically ships `sha256` rather than
    GNU coreutils' `sha256sum` -- check its output against the matching
    line in `checksums.txt` by hand:

    ```
    sha256 repoman-freebsd-amd64
    ```
